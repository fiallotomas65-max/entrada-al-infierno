<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ingresar - C.D.S.</title>
    <link rel="stylesheet" href="assets/css/estilos.css?v=3">
</head>
<body>
    <main>
        <div class="pantalla-login">
            <div id="logo-login" style="margin-bottom: 20px;"></div>

            <div id="zona-mensaje"></div>

            <form id="form-login">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" maxlength="50" autocomplete="username">

                <label for="contrasena">Contrasena</label>
                <input type="password" id="contrasena" name="contrasena" maxlength="100" autocomplete="current-password">

                <button type="submit" class="boton" style="width:100%;">Ingresar</button>
            </form>
        </div>
    </main>

    <script src="assets/js/comun.js?v=3"></script>
    <script src="assets/js/login.js?v=3"></script>
</body>
</html>
