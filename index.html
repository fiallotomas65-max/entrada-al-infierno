<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>C.D.S. - Hospital de Clinicas</title>
    <link rel="stylesheet" href="assets/css/estilos.css?v=3">
</head>
<body>
    <main style="text-align:center; margin-top:80px;">
        <div id="logo-portada"></div>
        <p style="color:#6b7280;">Cargando...</p>
    </main>

    <script src="assets/js/comun.js?v=3"></script>
    <script>
        pintarLogoGrande("logo-portada");

        // si ya hay sesion, va directo al panel; si no, al login
        fetch(RAIZ + "api/sesion.php")
            .then(function (r) { return r.json(); })
            .then(function (datos) {
                if (datos.logueado) {
                    window.location.href = RAIZ + "panel.html";
                } else {
                    window.location.href = RAIZ + "login.html";
                }
            });
    </script>
</body>
</html>
